<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Home TV</title>

<link href="https://fonts.googleapis.com/css2?family=Product+Sans:wght@400;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Product Sans',sans-serif;
}

body{
    background:#0b0b0d;
    color:white;
    overflow-x:hidden;
}

/* GRID MODE */
body.grid .apps-row{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(120px,1fr));
    gap:25px;
}

body.grid .app{
    display:flex;
    flex-direction:column;
    align-items:center;
}

/* TOP BANNER */
.top-banner{
    width:100%;
    height:260px;
    background:url('https://i.postimg.cc/2yMTv4dF/IMG-3425.jpg');
    background-size:cover;
    background-position:center;
    position:relative;
}

.top-banner::after{
    content:'';
    position:absolute;
    inset:0;
    background:linear-gradient(to bottom, rgba(0,0,0,0.1), rgba(11,11,13,1));
}

.top-ui{
    position:absolute;
    top:25px;
    left:25px;
    z-index:2;
}

.time{
    font-size:48px;
    font-weight:700;
}

.welcome-text{
    margin-top:6px;
    font-size:14px;
    opacity:0.8;
}

/* SEARCH */
.search-wrapper{
    padding:20px 30px;
}

.search-container{
    background:rgba(31,31,34,.7);
    backdrop-filter:blur(12px);
    border-radius:999px;
    display:flex;
    align-items:center;
    padding:16px 20px;
}

.search-container input{
    flex:1;
    background:transparent;
    border:none;
    outline:none;
    color:white;
    font-size:16px;
}

.search-container button{
    border:none;
    background:#4285f4;
    color:white;
    padding:10px 18px;
    border-radius:999px;
    cursor:pointer;
}

/* SECTIONS */
.section{
    padding:0 30px 45px;
}

.section-title{
    font-size:24px;
    margin-bottom:18px;
    font-weight:700;
}

.apps-row{
    display:flex;
    gap:20px;
    overflow-x:auto;
    padding-bottom:10px;
}

/* APP */
.app{
    text-decoration:none;
    color:white;
    min-width:120px;
    transition:transform .25s ease;
}

.app:hover{
    transform:scale(1.06);
}

.app-icon{
    width:110px;
    height:110px;
    border-radius:28px;
    background:#1d1f24;
    display:flex;
    align-items:center;
    justify-content:center;
    margin-bottom:10px;
}

.app-icon img{
    width:60%;
    height:60%;
    object-fit:contain;
}

.app-name{
    text-align:center;
    font-size:15px;
}

/* CUSTOM */
.add-app-btn{
    background:#4285f4;
    color:white;
    border:none;
    padding:12px 18px;
    border-radius:14px;
    cursor:pointer;
}

.delete-app{
    margin-top:8px;
    background:#ff4d4d;
    border:none;
    color:white;
    padding:6px 10px;
    border-radius:10px;
    cursor:pointer;
    font-size:12px;
}

/* TOGGLE */
.toggle{
    position:fixed;
    bottom:20px;
    right:20px;
    background:rgba(26,27,31,.7);
    backdrop-filter:blur(12px);
    padding:12px 14px;
    border-radius:12px;
    font-size:14px;
}

</style>
</head>

<body>

<div class="top-banner">
    <div class="top-ui">
        <div class="time" id="clock">--:--:--</div>
        <div class="welcome-text">Its great to see you again</div>
    </div>
</div>

<!-- SEARCH -->
<div class="search-wrapper">
<form class="search-container" onsubmit="handleSearch(event)">
    <input id="searchInput" placeholder="Search or enter URL">
    <button type="submit">Go</button>
</form>
</div>

<!-- STREAMING -->

<div class="apps-row">

<div class="app-name">YouTube</div>

<a class="app" href="https://www.max.com">

<!-- CUSTOM APPS -->
<div class="section">
<div class="section-title">Custom Apps</div>

<div class="apps-row" id="customApps"></div>

<br>

<button class="add-app-btn" onclick="addCustomApp()">
+ Add App
</button>

</div>

<!-- TOGGLE -->
<div class="toggle">
<label>
<input type="checkbox" onchange="toggleGrid(this)">
Grid View
</label>
</div>

<script>

/* CLOCK */
setInterval(()=>{
const d=new Date();
let h=d.getHours();
let m=String(d.getMinutes()).padStart(2,'0');
let s=String(d.getSeconds()).padStart(2,'0');
let am=h>=12?"PM":"AM";
h=h%12||12;
document.getElementById("clock").innerText=`${h}:${m}:${s} ${am}`;
},1000);

/* SEARCH */
function handleSearch(e){
e.preventDefault();
let i=document.getElementById("searchInput").value.trim();
if(!i) return;

if(i.includes(".") && !i.includes(" ")){
window.open("https://" + i);
return;
}

window.open("https://google.com/search?q=" + encodeURIComponent(i));
}

/* GRID */
function toggleGrid(el){
document.body.classList.toggle("grid",el.checked);
}

/* STORAGE */
function getSavedApps(){
return JSON.parse(localStorage.getItem("customApps")) || [];
}

function saveApps(apps){
localStorage.setItem("customApps", JSON.stringify(apps));
}

function renderApps(){
const container=document.getElementById("customApps");
container.innerHTML="";

getSavedApps().forEach((app,i)=>{
const div=document.createElement("div");

div.innerHTML=`
<a class="app" href="${app.url}" target="_blank">
<div class="app-icon"><img src="${app.icon}"></div>
<div class="app-name">${app.name}</div>
</a>
<button class="delete-app" onclick="deleteApp(${i})">Delete</button>
`;

container.appendChild(div);
});
}

function addCustomApp(){
const name=prompt("App name");
if(!name) return;

let url=prompt("App URL");
if(!url) return;
if(!url.startsWith("http")) url="https://"+url;

const icon=prompt("Icon URL");
if(!icon) return;

const apps=getSavedApps();
apps.push({name,url,icon});
saveApps(apps);
renderApps();
}

function deleteApp(i){
const apps=getSavedApps();
apps.splice(i,1);
saveApps(apps);
renderApps();
}

renderApps();

</script>

</body>
</html>
