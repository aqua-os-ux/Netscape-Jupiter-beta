<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Home TV</title>

<link href="https://fonts.googleapis.com/css2?family=Product+Sans:wght@400;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />

<style>

.material-symbols-outlined {
  font-variation-settings:
  'FILL' 0,
  'wght' 400,
  'GRAD' 0,
  'opsz' 24
}

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Product Sans',sans-serif;
}

body{
background:
linear-gradient(rgba(0,0,0,0.35),rgba(0,0,0,0.55)),
url('https://i.postimg.cc/cLYKbm0X/IMG-3451.jpg');
background-size:cover;
background-position:center;
background-repeat:no-repeat;
background-attachment:fixed;

color:white;
overflow:hidden;
height:100vh;
}

/* TOP BAR */
.topbar{
height:70px;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 30px;
background:rgba(255,255,255,0.03);
backdrop-filter:blur(10px);
border-bottom:1px solid rgba(255,255,255,0.05);
}

.logo{
font-size:22px;
font-weight:700;
}

.status{
display:flex;
gap:14px;
font-size:14px;
opacity:0.9;
}

/* MAIN */
.main{
padding:40px 35px;
}

.welcome{
font-size:52px;
font-weight:700;
}

.subtitle{
opacity:0.8;
margin-top:8px;
}

/* DOCK */
.dock{
position:fixed;
bottom:22px;
left:50%;
transform:translateX(-50%);
width:90%;
max-width:700px;
height:90px;

background:rgba(25,25,28,0.45);
backdrop-filter:blur(18px);
border:1px solid rgba(255,255,255,0.08);
border-radius:32px;

display:flex;
align-items:center;
justify-content:space-around;
gap:10px;
}

body.drawer-open .dock{
display:none;
}

.dock-app{
width:60px;
height:60px;
border-radius:18px;
background:rgba(255,255,255,0.08);
border:1px solid rgba(255,255,255,0.12);
display:flex;
align-items:center;
justify-content:center;
cursor:pointer;
transition:0.2s;
}

.dock-app img{
width:34px;
height:34px;
border-radius:10px;
}

.dock-app:hover{
transform:scale(1.08);
}

.dock-btn{
width:60px;
height:60px;
border-radius:18px;
background:rgba(255,255,255,0.08);
border:1px solid rgba(255,255,255,0.12);
display:flex;
align-items:center;
justify-content:center;
cursor:pointer;
}

/* DRAWER */
.drawer{
position:fixed;
inset:0;
background:rgba(15,15,20,0.55);
backdrop-filter:blur(25px);

display:flex;
flex-direction:column;

opacity:0;
pointer-events:none;
transform:scale(1.05);
transition:0.25s ease;
}

.drawer.open{
opacity:1;
pointer-events:auto;
transform:scale(1);
}

.drawer-top{
height:60px;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 18px;
background:rgba(255,255,255,0.06);
border-bottom:1px solid rgba(255,255,255,0.08);
}

.drawer-title{
font-weight:600;
opacity:0.9;
}

.close-btn{
cursor:pointer;
padding:8px;
border-radius:12px;
transition:0.2s;
}

.close-btn:hover{
background:rgba(255,255,255,0.1);
}

.drawer-content{
flex:1;
padding:20px;
display:grid;
grid-template-columns:repeat(auto-fit,minmax(120px,1fr));
gap:18px;
overflow:auto;
}

.app{
background:rgba(255,255,255,0.06);
border:1px solid rgba(255,255,255,0.08);
border-radius:18px;
padding:12px;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
cursor:pointer;
transition:0.2s;
text-align:center;
}

.app:hover{
transform:scale(1.05);
background:rgba(255,255,255,0.1);
}

.app img{
width:48px;
height:48px;
border-radius:12px;
margin-bottom:8px;
}

.app span{
font-size:12px;
opacity:0.9;
}

</style>
</head>

<body>

<div class="topbar">
<div class="logo">Home TV</div>

<div class="status">
<div id="clock">--:--</div>
</div>
</div>

<div class="main">
<div class="welcome">Welcome back.</div>
<div class="subtitle">Your entertainment space is ready.</div>
</div>

<!-- DRAWER -->
<div class="drawer" id="drawer">

<div class="drawer-top">
<div style="width:40px;"></div>
<div class="drawer-title">Apps</div>

<div class="close-btn" onclick="toggleDrawer()">
<span class="material-symbols-outlined">close</span>
</div>

</div>

<div class="drawer-content">

<div class="app" onclick="openApp('https://docs.google.com')">
<img src="https://i.postimg.cc/hj3NyQbF/IMG-3427.png"><span>Docs</span>
</div>

<div class="app" onclick="openApp('https://mail.google.com')">
<img src="https://i.postimg.cc/c4L3WgSz/IMG-3440.png"><span>Gmail</span>
</div>

<div class="app" onclick="openApp('https://www.youtube.com')">
<img src="https://i.postimg.cc/FzqLwMyv/IMG-3463.png"><span>YouTube</span>
</div>

<div class="app" onclick="openApp('https://drive.google.com')">
<img src="https://i.postimg.cc/BvZqRDDw/IMG-3428.png"><span>Drive</span>
</div>

<div class="app" onclick="openApp('https://slides.google.com')">
<img src="https://i.postimg.cc/BvZqRDDw/IMG-3428.png"><span>Slides</span>
</div>

<div class="app" onclick="openApp('https://www.canva.com')">
<img src="https://i.postimg.cc/3RqNwgdd/IMG-3464.png"><span>Canva</span>
</div>

<div class="app" onclick="openApp('https://outlook.office.com')">
<img src="https://i.postimg.cc/zD9wth0n/IMG-3465.png"><span>Outlook</span>
</div>

<div class="app" onclick="openApp('https://teams.microsoft.com')">
<img src="https://i.postimg.cc/g0k3XHkf/IMG-3466.png"><span>Teams</span>
</div>

<div class="app" onclick="openApp('https://www.microsoft.com/microsoft-365/word')">
<img src="https://i.postimg.cc/4N6cWSKg/IMG-3468.png"><span>Word</span>
</div>

<div class="app" onclick="openApp('https://powerpoint.cloud.microsoft')">
<img src="https://i.postimg.cc/6342njsj/IMG-3469.png"><span>PowerPoint</span>
</div>

<div class="app" onclick="openApp('https://gemini.google.com')">
<img src="https://i.postimg.cc/fyLCcF48/IMG-3431.png"><span>Gemini</span>
</div>

<div class="app" onclick="openApp('https://translate.google.com')">
<img src="https://i.postimg.cc/5yR3n31p/IMG-3438.png"><span>Translate</span>
</div>

<div class="app" onclick="openApp('https://passwords.google.com')">
<img src="https://i.postimg.cc/cCbmXmZw/IMG-3439.png"><span>Passwords</span>
</div>

<div class="app" onclick="openApp('https://www.crunchyroll.com')">
<img src="https://i.postimg.cc/qqRwsYfQ/IMG-3441.png"><span>Crunchyroll</span>
</div>

<div class="app" onclick="openApp('https://tv.apple.com')">
<img src="https://i.postimg.cc/T1w0VS8g/IMG-3442.png"><span>Apple TV</span>
</div>

<div class="app" onclick="openApp('https://www.hulu.com')">
<img src="https://i.postimg.cc/hvjsLwFr/IMG-3443.png"><span>Hulu</span>
</div>

<div class="app" onclick="openApp('https://www.paramountplus.com')">
<img src="https://i.postimg.cc/90MbdS3b/IMG-3444.png"><span>Paramount+</span>
</div>

<div class="app" onclick="openApp('https://www.disneyplus.com')">
<img src="https://i.postimg.cc/bYC3yzbS/IMG-3505.png"><span>Disney+</span>
</div>

</div>
</div>

<!-- DOCK -->
<div class="dock">

<div class="dock-app" onclick="openApp('https://docs.google.com')">
<img src="https://i.postimg.cc/hj3NyQbF/IMG-3427.png">
</div>

<div class="dock-app" onclick="openApp('https://mail.google.com')">
<img src="https://i.postimg.cc/c4L3WgSz/IMG-3440.png">
</div>

<div class="dock-app" onclick="openApp('https://www.youtube.com')">
<img src="https://i.postimg.cc/FzqLwMyv/IMG-3463.png">
</div>

<div class="dock-app" onclick="openApp('https://drive.google.com')">
<img src="https://i.postimg.cc/BvZqRDDw/IMG-3428.png">
</div>

<div class="dock-btn" onclick="toggleDrawer()">
<span class="material-symbols-outlined">apps</span>
</div>

</div>

<script>

function toggleDrawer(){
document.getElementById("drawer").classList.toggle("open");
document.body.classList.toggle("drawer-open");
}

function openApp(url){
window.open(url,"_blank");
}

function updateClock(){
const now = new Date();
let h = now.getHours();
let m = now.getMinutes();

let ampm = h >= 12 ? "PM" : "AM";
h = h % 12;
h = h ? h : 12;

m = m < 10 ? "0" + m : m;

document.getElementById("clock").textContent = `${h}:${m} ${ampm}`;
}

updateClock();
setInterval(updateClock, 1000);

</script>

</body>
</html>
