<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Home TV</title>

<link href="https://fonts.googleapis.com/css2?family=Product+Sans:wght@400;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Product Sans',sans-serif;
}

body{
background:#0b0b0d;
color:white;
overflow-x:hidden;
}

/* layout */
.section{padding:0 30px 45px;}
.section-title{font-size:24px;margin-bottom:18px;font-weight:700;}

.apps-row{
display:flex;
gap:20px;
overflow-x:auto;
padding-bottom:10px;
}

/* app */
.app{
text-decoration:none;
color:white;
min-width:120px;
}

.app-icon{
width:110px;
height:110px;
border-radius:28px;
background:#1d1f24;
display:flex;
align-items:center;
justify-content:center;
margin-bottom:10px;
}

.app-icon img{
width:60%;
height:60%;
object-fit:contain;
}

.app-name{
text-align:center;
font-size:15px;
}

/* form */
.form-box{
background:#14161a;
padding:16px;
border-radius:16px;
margin-top:10px;
}

.form-box input{
width:100%;
padding:10px;
margin:6px 0;
border:none;
border-radius:10px;
background:#1f2228;
color:white;
outline:none;
}

.form-box button{
width:100%;
padding:10px;
border:none;
border-radius:10px;
background:#4285f4;
color:white;
cursor:pointer;
margin-top:6px;
}

.delete{
background:#ff4d4d;
border:none;
color:white;
padding:6px 10px;
border-radius:10px;
margin-top:6px;
cursor:pointer;
font-size:12px;
}

</style>
</head>

<body>

<div class="section">
<div class="section-title">Custom Apps</div>

<div class="apps-row" id="customApps"></div>

<div class="form-box">

<input id="appName" placeholder="App name">

<input id="appUrl" placeholder="App URL">

<input type="file" id="appIcon" accept="image/*">

<button onclick="addApp()">Add App</button>

</div>

</div>

<script>

/* storage */
function getApps(){
return JSON.parse(localStorage.getItem("apps")) || [];
}

function saveApps(a){
localStorage.setItem("apps",JSON.stringify(a));
}

/* render */
function render(){
const box=document.getElementById("customApps");
box.innerHTML="";

getApps().forEach((app,i)=>{

const div=document.createElement("div");

div.innerHTML=`
<a class="app" href="${app.url}" target="_blank">
<div class="app-icon">
<img src="${app.icon}">
</div>
<div class="app-name">${app.name}</div>
</a>
<button class="delete" onclick="del(${i})">Delete</button>
`;

box.appendChild(div);

});
}

/* file to base64 */
function toBase64(file){
return new Promise((res)=>{
const r=new FileReader();
r.onload=()=>res(r.result);
r.readAsDataURL(file);
});
}

/* add app */
async function addApp(){

const name=document.getElementById("appName").value;
const url=document.getElementById("appUrl").value;
const file=document.getElementById("appIcon").files[0];

if(!name||!url||!file) return;

let icon=await toBase64(file);

let apps=getApps();

apps.push({
name,
url:url.startsWith("http")?url:"https://"+url,
icon
});

saveApps(apps);
render();

/* reset */
document.getElementById("appName").value="";
document.getElementById("appUrl").value="";
document.getElementById("appIcon").value="";
}

/* delete */
function del(i){
let apps=getApps();
apps.splice(i,1);
saveApps(apps);
render();
}

render();

</script>

</body>
</html>
